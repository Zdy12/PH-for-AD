[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topofmri"
version = "1.0.0"
description = "Multiscale persistent-homology features for fMRI classification"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {text = "MIT"}
authors = [{name = "Dengyi Zhao"}]
dependencies = [
  "numpy>=1.23,<2.0",
  "scipy>=1.9",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "giotto-tda>=0.6.0",
  "joblib>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

